ction><section class=\"agentrow\" data-id=\"agent-1\"><div class=\"who\"><span class=\"monogram\">RW</span>Rowan<small>Engineer</small></div><p>Editing the reconnect path</p><p>Working, since 10:40</p></section><section class=\"agentrow\" data-id=\"agent-2\"><div class=\"who\"><span class=\"monogram\">KT</span>Kit<small>Engineer</small></div><p>Adding stream fixtures</p><p>Working, since 10:41</p></section><section class=\"agentrow\" data-id=\"agent-3\"><div class=\"who\"><span class=\"monogram\">SL</span>Sol<small>Reviewer</small></div><p>Review the reconnect patch</p><p>Waiting for Rowan, since 10:42</p></section><section class=\"agentrow\" data-id=\"agent-4\"><div class=\"who\"><span class=\"monogram\">LN</span>Lane<small>Research</small></div><p>Check retry behaviour</p><p>Side job for Mira, since 10:43</p></section><h2 style=\"margin-top:28px\">Tasks</h2><div class=\"taskrow\" data-id=\"task-0\"><span>◌</span>Reconnect stream<small>Rowan</small></div><div class=\"taskrow\" data-id=\"task-1\"><span>◌</span>Cover interrupted tools<small>Kit</small></div><div class=\"taskrow\" data-id=\"task-2\"><span>○</span>Review patch<small>Sol</small></div>";function notify(t){document.querySelector('.toast').textContent=t}function theme(){document.documentElement.classList.toggle('light')}function search(s){document.querySelectorAll('.chatrow').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(s.toLowerCase()))}function show(title,body,action){document.querySelector('dialog h2').textContent=title;document.querySelector('dialog p').textContent=body;document.querySelector('#confirm').textContent=action;document.querySelector('dialog').showModal()}function review(i){show('Review message',document.querySelector('#m'+i+' .content').innerText,'Review')}function like(b){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');notify('Reaction updated')}function reply(i){document.querySelector('#draft').value='Reply to '+document.querySelector('#m'+i+' .who').innerText.trim()+': ';document.querySelector('#draft').focus()}function edit(i){const e=document.querySelector('#m'+i+' .content');e.contentEditable=true;e.focus();notify('Editing message locally')}function removeMessage(i){show('Delete message?','','Delete');document.querySelector('#confirm').onclick=()=>{document.querySelector('#m'+i).remove();document.querySelector('dialog').close()}}function send(){let d=document.querySelector('#draft');if(!d.value.trim())return;const p=document.querySelector('.reading');if(!p){location.href='../chat/v13.html';return}const a=document.createElement('article');a.className='message user';a.textContent=d.value;p.append(a);d.value='';document.querySelector('.transcript').scrollTop=1e9;notify('Queued locally')}function openTeam(){document.querySelector('.panel').hidden=false;tab('Team')}function tab(t,b){document.querySelector(".panelcontent").innerHTML=t==="Team"?teamHTML:t==="Diff"?diffHTML:t==="Terminal"?"<h2>Terminal</h2><pre class=\"diff\">$ npm test -- reconnect\n12 tests passed\n\n$ <input aria-label=\"Terminal command\" style=\"width:90%;background:transparent;border:0\" onkeydown=\"if(event.key==='Enter'){notify('Command entered locally');this.value=''}\"></pre>":"<h2>Files</h2><details open><summary>src</summary><button onclick=\"tab('Diff')\">stream.ts</button></details><details open><summary>tests</summary><button onclick=\"notify('Selected reconnect.test.ts')\">reconnect.test.ts</button></details>";document.querySelectorAll(".tabs button").forEach(e=>e.classList.toggle("active",e.textContent===t))}function roles(){const checked=[...document.querySelectorAll('.agentcheck:checked')];document.querySelectorAll('.agentcheck').forEach(e=>e.disabled=!e.checked&&checked.length>=5);for(const id of ['supervisor','reviewer']){const s=document.querySelector('#'+id),old=s.value;s.innerHTML=(id==='reviewer'?'<option value="">None</option>':'<option value="">Choose</option>')+checked.map(e=>'<option>'+e.value+'</option>').join('');s.valu
