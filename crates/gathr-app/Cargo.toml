[package]
name = "gathr-app"
description = "Gathr's desktop window: a Tauri 2 window over the web UI (docs/decisions/0012-ui-shell.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "gathr-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
gathr = { path = "../gathr" }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"

[lints]
workspace = true
