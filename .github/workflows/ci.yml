name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: file size
        shell: bash
        run: bash scripts/check-file-size.sh
      - name: recording scrub
        run: node scripts/scrub-frames.check.mjs
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      # The Mac checks run CI's build, so nothing gets built on the Mac.
      - name: keep the macOS build
        if: matrix.name == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gathr-macos
          path: |
            target/debug/gathrd
            target/debug/gathr
          retention-days: 7
