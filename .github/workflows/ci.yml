name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: file size
        shell: bash
        run: bash scripts/check-file-size.sh
      - name: recording scrub
        run: node scripts/scrub-frames.check.mjs
      - name: registry files unchanged
        run: node scripts/registry.check.mjs
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Runs every test binary at once: the suite's time is its tests', one binary after another.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: test
        run: cargo nextest run --workspace --locked --no-fail-fast
        env:
          GATHR_TEST_KEEP: ${{ runner.temp }}/gathr-test-failures
      # A failing test that ran a service keeps its data folder (tests/common): kept here.
      - name: keep failing tests' data folders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-failures-${{ matrix.name }}
          path: ${{ runner.temp }}/gathr-test-failures
          if-no-files-found: ignore
          retention-days: 7
      # The Mac checks run CI's build, so nothing gets built on the Mac.
      - name: build the window
        if: matrix.name == 'macOS'
        run: cargo build -p gathr-app --locked
      - name: keep the macOS build
        if: matrix.name == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gathr-macos
          path: |
            target/debug/gathrd
            target/debug/gathr
            target/debug/gathr-app
          retention-days: 7

  ui:
    name: UI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Windows tests run in the runner's own Edge (WebView2's engine), so only macOS downloads one.
      - if: runner.os == 'macOS'
        run: npx playwright install webkit
      - run: npx biome ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # A failing test leaves its screenshot in ui/.vitest: kept, so a failure on the other system shows.
      - name: keep failing tests' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failures-${{ matrix.name }}
          path: ui/.vitest
          include-hidden-files: true
          retention-days: 7
      - run: npx vite build
      # The built UI, which gathrd serves from a `ui` folder beside it (AGENTS.md "Run it installed").
      - name: keep the built UI
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gathr-ui
          path: ui/dist
          retention-days: 7
